# my-homelab-gitops/infrastructure/nfs-provisioner/values.yaml
nfs:
  server: 10.8.0.2
  path: /data/share/k3s
storageClass:
  create: true
  name: nfs-client
  # Longhorn is the cluster default; opting out here keeps PVCs that omit a
  # storageClassName from landing on NFS by accident.
  defaultClass: false
  reclaimPolicy: Retain # Do not delete the data when the PVC is deleted
