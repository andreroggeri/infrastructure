apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}-database
spec:
  instances: 1
  imageName: {{ .Values.database.imageName }}
  # Puts the database volume in the nightly Longhorn backup group.
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/backup: enabled
  postgresql:
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
        image:
          reference: {{ .Values.database.vchordImage }}
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
  storage:
    size: {{ .Values.database.size }}
    storageClass: {{ .Values.database.storageClass }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.name }}-database
spec:
  # "app" database and owner are created by CNPG; credentials are in the
  # <cluster>-app secret (key `uri`).
  name: app
  owner: app
  cluster:
    name: {{ .Values.name }}-database
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
