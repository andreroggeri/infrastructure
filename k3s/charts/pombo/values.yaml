image:
  repository: ghcr.io/andreroggeri/tiny-apps/pombo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

paperless:
  # API base the bot calls (in-cluster).
  url: ""
  # Secret holding the API token of the account uploads are made as.
  tokenSecret:
    name: ""
    key: paperless-token

# Bearer token coruja sends to POST /notify. Optional key in the secret above;
# without it the endpoint refuses everything.
notifyTokenKey: notify-token

# OpenAI-compatible API with image input, used to group photos sent together
# into documents. Leave url empty to file every photo separately.
llm:
  url: ""
  model: ""

# Condo bookings (reservas handler). The app refuses to start without the
# site URL and the condo/unit IDs.
superlogica:
  # Login service that returns a session (see apps/pombo/login in tiny-apps).
  # Empty: sessions renew in-process from the pasted SSO cookies.
  loginUrl: ""
  # The condo host and the condo/unit IDs together identify a single
  # apartment, so they live in the sealed secret, never in values.
  secret:
    name: ""
    urlKey: superlogica-url
    condoIdKey: superlogica-condo-id
    unitIdKey: superlogica-unit-id

resources: {}

persistence:
  storageClass: ""
  size: 200Mi
  # true adds the volume to the nightly Longhorn backup group.
  backup: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
