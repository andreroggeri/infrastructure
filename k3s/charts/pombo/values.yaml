image:
  repository: ghcr.io/andreroggeri/pombo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

paperless:
  # API base the bot calls (in-cluster).
  url: ""
  # Secret holding the API token of the account uploads are made as.
  tokenSecret:
    name: ""
    key: paperless-token

# OpenAI-compatible API with image input, used to group photos sent together
# into documents. Leave url empty to file every photo separately.
llm:
  url: ""
  model: ""

resources: {}

persistence:
  storageClass: ""
  size: 200Mi
  # true adds the volume to the nightly Longhorn backup group.
  backup: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
