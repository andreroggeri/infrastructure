{{- range $name, $app := .Values.apps }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-config
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    # Longhorn copies recurring-job labels from the PVC to its volume, putting
    # it in the nightly off-site backup group (docs/backups.md).
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $.Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ $app.configSize | default "1Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: {{ if hasKey $app "replicas" }}{{ $app.replicas }}{{ else }}1{{ end }}
  # SQLite on an RWO volume: never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      {{- with $app.nodeName }}
      nodeSelector:
        kubernetes.io/hostname: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            failureThreshold: 6
          resources:
            {{- toYaml ($app.resources | default $.Values.resources) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- range $i, $p := $app.hostPaths }}
            - name: host-{{ $i }}
              mountPath: {{ $p.mountPath }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config
        {{- range $i, $p := $app.hostPaths }}
        - name: host-{{ $i }}
          hostPath:
            path: {{ $p.hostPath }}
            type: Directory
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
{{- if and $.Values.ingress.domain (ne (toString $app.ingress) "false") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ printf "%s.%s" $name $.Values.ingress.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
