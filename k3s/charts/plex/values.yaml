image:
  repository: lscr.io/linuxserver/plex
  tag: ""
  pullPolicy: IfNotPresent

# 0 keeps the volume but stops Plex (used while copying config in).
replicas: 1

nodeName: ""

env:
  PUID: "1001"
  PGID: "1001"
  TZ: America/Sao_Paulo

# Hardware transcoding through the Intel GPU device plugin.
gpu: true

persistence:
  config:
    storageClass: longhorn
    size: 5Gi
    # Put the volume in the nightly off-site Longhorn backup (docs/backups.md).
    backup: true

# Host paths on nodeName.
media:
  hostPath: ""
  mountPath: /data
transcode:
  hostPath: ""

ingress:
  enabled: false
  className: traefik
  hosts: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 4Gi
