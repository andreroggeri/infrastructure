# Booker release overrides. Chart defaults cover the rest (charts/booker/values.yaml).
config:
  TARGET_DATE: "11/01/2026"      # Nov 1 2026, opens Aug 3 2026
  AREA_ID: "766"                 # Salao de Festas
  UNIT_ID: "6471"
  CONDO_ID: "58"
  NOME_AREA: "SALAO DE FESTAS - 10H as 24hH"
  POLL_INTERVAL_SECONDS: "2"

heartbeat:
  enabled: true
  schedule: "0 9 * * *"

watch:
  enabled: true
  # Probe (2026-07-17) pinned the flip to exactly 00:00 Sao Paulo. Fire 23:50 on
  # Aug 2 (polls through the midnight Aug 3 flip -> books Nov 1) plus Aug 3-5 as a
  # daily re-arm safety net: if a night's pod fails, later nights re-grab Nov 1
  # (stays open after Aug 3). reservar.py is idempotent - a re-arm run that finds
  # the date already ours notifies "Salao still secured" and exits without dupe.
  schedule: "50 23 2-5 8 *"      # Aug 2,3,4,5 at 23:50 America/Sao_Paulo

# Flip to true, set targetDate, `helmfile apply`, read logs, then flip back.
probe:
  enabled: false
  targetDate: "10/15/2026"
