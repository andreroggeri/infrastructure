hub:
  appUrl: https://monitor.local.roggeri.com.br
  existingSecret: beszel-hub
  env:
    # Log in through Pocket ID only.
    DISABLE_PASSWORD_AUTH: "true"

ingress:
  enabled: true
  host: monitor.local.roggeri.com.br

agent:
  existingSecret: beszel-agent
  nodes:
    - name: alexandria
      # NAS compose stacks still run on Docker here.
      docker: true
      smart: true
      extraFilesystems:
        - name: data
          hostPath: /data
        - name: archive
          hostPath: /archive
    # Oracle Cloud VM: virtual disk, no S.M.A.R.T.
    - name: k3s-node-01
    - name: ubuntu
      smart: true
