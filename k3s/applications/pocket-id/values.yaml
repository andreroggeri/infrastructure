# Passkey-only OpenID Connect provider. Users, groups and OIDC clients are
# managed in its UI, not here.
#
# Passkeys are bound to the APP_URL domain: changing it later breaks every
# registered passkey.

image:
  tag: v2.18.0

env:
  - name: APP_URL
    value: https://id.local.roggeri.com.br
  # Traefik pods; lets Pocket ID see the real client IP.
  - name: TRUST_PROXY
    value: 10.42.0.0/16
  - name: ANALYTICS_DISABLED
    value: "true"
  - name: ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: pocket-id
        key: encryption-key
  # Admin API access for scripting (X-API-Key header). Cluster access
  # already implies full control, so this adds no new exposure.
  - name: STATIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: pocket-id
        key: api-key

persistence:
  enabled: true
  storageClass: longhorn
  size: 500Mi
  # Longhorn backup group (docs/backups.md).
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: id.local.roggeri.com.br
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
