authentik:
  secret_key: "file:///authentik-secrets/secret_key"
  # This sends anonymous usage-data, stack traces on errors and
  # performance data to sentry.io, and is fully opt-in
  error_reporting:
    enabled: true
  postgresql:
    password: file:///authentik-secrets/password

server:
  ingress:
    ingressClassName: traefik
    enabled: true
    hosts:
      - authentik.local.roggeri.com.br
      - auth.local.roggeri.com.br
  volumes:
    - name: authentik-secrets
      secret:
        secretName: authentik-secrets
  volumeMounts:
    - name: authentik-secrets
      mountPath: /authentik-secrets
      readOnly: true
worker:
  volumes:
    - name: authentik-secrets
      secret:
        secretName: authentik-secrets
  volumeMounts:
    - name: authentik-secrets
      mountPath: /authentik-secrets
      readOnly: true
  # Read by blueprints via !Env. Blueprints are applied by the worker.
  env:
    - name: PAPERLESS_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: paperless-oidc
          key: client-secret

# Applications managed as code. Apps created in the UI before this
# (Actual Budget, Open WebUI, Memos, n8n) are not in here.
blueprints:
  configMaps:
    - authentik-blueprints

additionalObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authentik-blueprints
    data:
      paperless.yaml: |
        version: 1
        metadata:
          name: Paperless SSO
        entries:
          - model: authentik_providers_oauth2.oauth2provider
            id: provider
            identifiers:
              name: Provider for Paperless
            attrs:
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              client_type: confidential
              client_id: paperless
              # The UI fills this in; a blueprint must, or every login
              # fails with "Invalid grant_type for provider".
              grant_types:
                - authorization_code
                - refresh_token
              client_secret: !Env PAPERLESS_OIDC_CLIENT_SECRET
              redirect_uris:
                - matching_mode: strict
                  url: https://docs.local.roggeri.com.br/accounts/oidc/authentik/login/callback/
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
                - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          - model: authentik_core.application
            identifiers:
              slug: paperless
            attrs:
              name: Paperless
              provider: !KeyOf provider
              meta_launch_url: https://docs.local.roggeri.com.br

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-secrets
    secretKeys:
      userPasswordKey: password

  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

global:
  defaultStorageClass: "longhorn"

redis:
  enabled: true
  master:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 200Mi
