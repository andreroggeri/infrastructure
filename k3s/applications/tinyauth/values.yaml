# Traefik forward-auth for apps without their own SSO (pombo's dashboard). Logins go to
# Pocket ID, which is the OpenID Connect provider for everything else.
#
# Local fallback users live in the sealed secret tinyauth-users (password
# hash + TOTP, and emails, since this repo is public). Add or change one
# with utils/tinyauth-user.sh, then restart the deployment.

image:
  tag: v5.2.0

# SQLite on a single RWO volume: never run two pods at once.
deploymentStrategy:
  type: Recreate

tinyauth:
  appUrl: https://auth.local.roggeri.com.br
  # Ingress-annotation ACLs need cluster-wide RBAC; access is configured
  # here instead.
  labelProvider: none
  analytics:
    enabled: false
  auth:
    secureCookie: true
    # Traefik pods; lets tinyauth see the real client IP.
    trustedProxies: 10.42.0.0/16
    # Chart defaults contain one empty example entry each; clear them.
    userAttributes: []
  apps: []
  # Forward-auth logins go to Pocket ID (OIDC client "tinyauth" there).
  # Only accounts that exist in Pocket ID can sign in, so no whitelist.
  # Local users above stay as a fallback at /login.
  oauth:
    autoRedirect: pocketid
    providers:
      - id: pocketid
        name: Pocket ID
        clientId: tinyauth
        clientSecretSecretRef:
          name: tinyauth-pocket-id
          key: client-secret
        scopes: openid email profile groups
        authUrl: https://id.local.roggeri.com.br/authorize
        tokenUrl: https://id.local.roggeri.com.br/api/oidc/token
        userInfoUrl: https://id.local.roggeri.com.br/api/oidc/userinfo
        redirectUrl: https://auth.local.roggeri.com.br/api/oauth/callback/pocketid
  # Pocket ID is the OIDC provider now. The chart default has one empty
  # example client; clear it.
  oidc:
    clients: []

env:
  # The chart only renders this setting when true, so `analytics.enabled:
  # false` alone leaves tinyauth's default (on). Set it explicitly.
  - name: TINYAUTH_ANALYTICS_ENABLED
    value: "false"
  - name: TINYAUTH_AUTH_USERS
    valueFrom:
      secretKeyRef:
        name: tinyauth-users
        key: users
  # Emails are kept out of this public repo. Optional so a user without an
  # email entry doesn't stop tinyauth from starting.
  - name: TINYAUTH_AUTH_USERATTRIBUTES_ANDRE_EMAIL
    valueFrom:
      secretKeyRef:
        name: tinyauth-users
        key: andre-email
        optional: true
  - name: TINYAUTH_AUTH_USERATTRIBUTES_LUANA_EMAIL
    valueFrom:
      secretKeyRef:
        name: tinyauth-users
        key: luana-email
        optional: true

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: auth.local.roggeri.com.br
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

# The chart's own PVC can't carry labels, so the volume is defined here with
# the Longhorn backup-group labels (docs/backups.md) and mounted below.
volumes:
  - name: data
    persistentVolumeClaim:
      claimName: tinyauth-data
volumeMounts:
  - name: data
    mountPath: /data

extraObjects:
  # Forward-auth for apps without their own SSO (pombo's dashboard). Use on an Ingress with
  #   traefik.ingress.kubernetes.io/router.middlewares: tinyauth-forward-auth@kubernetescrd
  # Traefik replaces any client-sent copies of these headers with tinyauth's.
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: forward-auth
    spec:
      forwardAuth:
        address: http://tinyauth.tinyauth.svc.cluster.local/api/auth/traefik
        authResponseHeaders:
          - Remote-User
          - Remote-Email
          - Remote-Name
          - Remote-Groups

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: tinyauth-data
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/backup: enabled
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn
      resources:
        requests:
          storage: 500Mi
