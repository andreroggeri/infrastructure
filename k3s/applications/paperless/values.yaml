image:
  tag: "3.3.4"

# Pinned to the NAS for the consume/export folders on /archive.
nodeSelector:
  kubernetes.io/hostname: alexandria

env:
  - name: PAPERLESS_URL
    value: https://docs.local.roggeri.com.br
  - name: PAPERLESS_TIME_ZONE
    value: America/Sao_Paulo
  - name: PAPERLESS_OCR_LANGUAGE
    value: por
  # Installed at container start; `eng` ships with the image.
  - name: PAPERLESS_OCR_LANGUAGES
    value: por
  - name: PAPERLESS_REDIS
    value: redis://redis:6379
  # Required since v3; the engine is no longer inferred from DBHOST.
  - name: PAPERLESS_DBENGINE
    value: postgresql
  - name: PAPERLESS_DBHOST
    value: db-rw
  - name: PAPERLESS_DBNAME
    value: paperless
  - name: PAPERLESS_DBUSER
    valueFrom:
      secretKeyRef:
        name: db-app
        key: username
  - name: PAPERLESS_DBPASS
    valueFrom:
      secretKeyRef:
        name: db-app
        key: password
  # Traefik is the only hop in front; lets login rate limiting see the
  # real client IP instead of answering 403 (v3 change).
  - name: PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT
    value: "1"
  # SSO via Pocket ID (OIDC client "paperless", managed in its UI).
  # Regular login stays enabled as a fallback; link an existing account
  # from Profile → Connect, since auto signup is off.
  - name: PAPERLESS_APPS
    value: allauth.socialaccount.providers.openid_connect
  - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
    valueFrom:
      secretKeyRef:
        name: paperless-oidc
        key: providers
  - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
    value: "false"
  - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
    value: "false"
  # AI features use the local llama.cpp server, which is on a private
  # address; paperless blocks those by default. Not settable in the UI.
  # The rest of the AI config is set in the UI (Settings → Configuration).
  - name: PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS
    value: "true"
  - name: PAPERLESS_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: paperless-secrets
        key: secret-key

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

persistence:
  # Search index and classifier model.
  data:
    enabled: true
    mountPath: /usr/src/paperless/data
    storageClass: longhorn
    size: 500Mi
    backup: true
  # Original and archived documents, thumbnails.
  media:
    enabled: true
    mountPath: /usr/src/paperless/media
    storageClass: longhorn
    size: 1Gi
    backup: true

hostPaths:
  - name: consume
    path: /archive/data/paperless/consume
    mountPath: /usr/src/paperless/consume
  - name: export
    path: /archive/data/paperless/export
    mountPath: /usr/src/paperless/export

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: docs.local.roggeri.com.br
      paths:
        - path: /
          pathType: Prefix

extraManifests:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: db
    spec:
      instances: 1
      # Puts the database volume in the nightly Longhorn backup group.
      inheritedMetadata:
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/backup: enabled
      bootstrap:
        initdb:
          database: paperless
          owner: paperless
      postgresql:
        parameters:
          shared_buffers: "64MB"
      resources:
        requests:
          memory: "256Mi"
        limits:
          memory: "512Mi"
      storage:
        size: 1Gi
        storageClass: longhorn

  # Task queue only; nothing here needs to survive a restart.
  - apiVersion: redis.redis.opstreelabs.in/v1beta2
    kind: Redis
    metadata:
      name: redis
    spec:
      kubernetesConfig:
        image: quay.io/opstree/redis:v7.4.11
