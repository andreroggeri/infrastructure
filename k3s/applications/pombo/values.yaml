# Public image built by github.com/andreroggeri/pombo CI; pin the sha- tag.
image:
  tag: "sha-b7cb3e3"

paperless:
  url: http://paperless.paperless.svc:8000
  tokenSecret:
    name: pombo-secrets
    key: paperless-token

# Gemma on the llama.cpp router; groups photos into documents.
llm:
  url: http://192.168.15.5:8080/v1
  model: gemma-4-26B-A4B-it-UD-Q4_K_M

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

persistence:
  storageClass: longhorn
  size: 200Mi
  # WhatsApp session + routing settings. Losing it means re-pairing the phone.
  backup: true

ingress:
  enabled: true
  className: traefik
  # The dashboard has no login of its own.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: tinyauth-forward-auth@kubernetescrd
  host: pombo.local.roggeri.com.br
