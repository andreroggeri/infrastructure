# Public image built by github.com/andreroggeri/tiny-apps CI; pin the sha- tag.
image:
  tag: "sha-b46434a"

paperless:
  url: http://paperless.paperless.svc:8000
  tokenSecret:
    name: pombo-secrets
    key: paperless-token

# Condo booking identifiers live in the pombo-secrets sealed secret.
superlogica:
  secret:
    name: pombo-secrets

# Gemma on the llama.cpp router; groups photos into documents.
llm:
  url: http://192.168.15.5:8080/v1
  model: gemma-4-26B-A4B-it-UD-Q4_K_M

# Crops photos to the page before filing. Pin the sha- tag CI publishes.
tesourinha:
  image:
    tag: "sha-b46434a"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      # A 12 MP photo is ~36 MB decoded; a few copies while cropping.
      memory: 512Mi

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

persistence:
  storageClass: longhorn
  size: 200Mi
  # WhatsApp session + routing settings. Losing it means re-pairing the phone.
  backup: true

ingress:
  enabled: true
  className: traefik
  # The dashboard has no login of its own.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: tinyauth-forward-auth@kubernetescrd
  host: pombo.local.roggeri.com.br
