nodeName: alexandria

# Same host and mount paths as the old NAS job, so restic continues the existing
# snapshot history instead of starting a new one.
host: alexandria

existingSecret: restic-b2

uptimeKuma:
  tokenSecret: restic-pings

backup:
  # 22:00 São Paulo, before Longhorn's 03:00 run.
  schedule: "0 22 * * *"
  targets:
    # k3s Immich (fresh library, 2026-10).
    - name: immich-library
      hostPath: /archive/data/immich
      mountPath: /mnt/immich-library
      tag: immich
      excludes:
        - "*.tmp"
        # Generated from the originals; regenerated on demand.
        - "/mnt/immich-library/thumbs"
        - "/mnt/immich-library/encoded-video"

prune:
  # Sundays 05:00 São Paulo. Pruning rewrites pack files, so weekly is enough.
  schedule: "0 5 * * 0"
  args: "--keep-last 5 --keep-monthly 2"
