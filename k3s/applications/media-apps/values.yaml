# Moved from nas/compose/media-download.docker-compose.yml. Mount paths match
# the compose file, so paths stored in each app's database still work.
ingress:
  domain: local.roggeri.com.br

apps:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    port: 9091
    nodeName: alexandria
    hostPaths:
      - hostPath: /archive/torrents
        mountPath: /data/torrents
      - hostPath: /archive/torrents/downloads
        mountPath: /downloads
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    port: 7878
    configSize: 2Gi
    nodeName: alexandria
    hostPaths:
      - hostPath: /archive
        mountPath: /data
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    port: 8989
    configSize: 2Gi
    nodeName: alexandria
    hostPaths:
      - hostPath: /archive
        mountPath: /data
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    port: 6767
    nodeName: alexandria
    hostPaths:
      - hostPath: /archive/media
        mountPath: /data/media
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    port: 9696
  # Archived upstream (2026-02), replaced by seerr below. Stopped; its volume
  # is the pre-migration backup. Remove once Seerr has run for a while.
  overseerr:
    image: lscr.io/linuxserver/overseerr:1.35.0
    port: 5055
    replicas: 0
    ingress: false
  # Successor of Overseerr. Migrated its config on first start (2026-10-26).
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    port: 5055
    configMountPath: /app/config
    # Runs as the image's node user and has no init of its own.
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    shareProcessNamespace: true
    extraHosts:
      - overseerr
