ingress:
  enabled: true
  className: traefik
  hosts:
    - host: uptime.local.roggeri.com.br
      paths:
        - path: /
          pathType: Prefix

volume:
  enabled: true
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  # Matches the PVC already provisioned (chart default, since the old
  # `persistence:` key was never a real chart field). PVCs can't shrink,
  # so this stays 4Gi instead of the originally-intended 500Mi.
  size: 4Gi

