# Legacy services running on plain docker compose

# Immich (old NAS install, v1.134). The k3s Immich took photos.local;
# this keeps the old one at photos-old.local until its library is removed.
---
apiVersion: v1
kind: Service
metadata:
  name: immich-proxy-by-dns # This is the name K3s Traefik will use
  namespace: migration
spec:
  type: ExternalName
  externalName: photos.local.roggeri.com.br # The FQDN of your Docker Traefik
  ports:
    - protocol: TCP
      port: 4443
      targetPort: 4443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-proxy-http
  namespace: migration
spec:
  entryPoints:
    - web # HTTP entrypoint - global redirect middleware will handle this
  routes:
    - match: Host(`photos-old.local.roggeri.com.br`)
      kind: Rule
      services:
        - name: immich-proxy-by-dns
          passHostHeader: false
          port: 4443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-proxy
  namespace: migration
spec:
  entryPoints:
    - websecure # Client connects to K3s Traefik via HTTPS
  routes:
    - match: Host(`photos-old.local.roggeri.com.br`)
      kind: Rule
      services:
        - name: immich-proxy-by-dns # Point to the new ExternalName Service
          # The NAS Traefik only knows photos.local; send it that Host.
          passHostHeader: false
          port: 4443 # The port defined in the ExternalName Service
          scheme: https

