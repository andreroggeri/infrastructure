repositories:
  - name: nfs-subdir-external-provisioner
    url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
  - name: community-charts
    url: https://community-charts.github.io/helm-charts
  - name: home-assistant
    url: http://pajikos.github.io/home-assistant-helm-chart/
  - name: t3n
    url: https://storage.googleapis.com/t3n-helm-charts
  - name: zigbee2mqtt
    url: https://charts.zigbee2mqtt.io/
  - name: longhorn
    url: https://charts.longhorn.io
  - name: garage
    url: git+https://git.deuxfleurs.fr/Deuxfleurs/garage.git@script/helm/garage?ref=main-v2
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: wrsys
    url: https://wrsys.github.io/helm-charts/
  - name: ot-helm
    url: https://ot-container-kit.github.io/helm-charts/
  - name: dirsigler
    url: https://dirsigler.github.io/uptime-kuma-helm
  - name: memo-mcp
    url: https://andreroggeri.github.io/memo-mcp/
  - name: tinyauth
    url: https://helm.tinyauth.app

releases:
  - name: sealed-secrets-manifests
    namespace: kube-system
    chart: ./charts/sealed-secrets-manifests
    version: 0.1.0

  - name: nfs-provisioner
    namespace: kube-system
    chart: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
    version: 4.0.18
    values:
      - ./infrastructure/nfs-provisioner/values.yaml

  - name: longhorn
    namespace: longhorn-system
    createNamespace: true
    chart: longhorn/longhorn
    version: 1.13.0
    values:
      - ./infrastructure/longhorn/values.yaml

  - name: storage-classes
    namespace: longhorn-system
    chart: ./charts/storage-classes
    version: 0.1.0
    needs:
      - longhorn-system/longhorn

  - name: cloudnative-pg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    createNamespace: true
    version: "0.29.1"

  - name: redis-operator
    namespace: redis-operator-system
    createNamespace: true
    chart: ot-helm/redis-operator
    version: 0.27.0

  - name: actual-budget
    namespace: actual-budget
    chart: community-charts/actualbudget
    version: 1.9.5
    values:
      - ./applications/actual-budget/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: actual-http-api
    namespace: actual-budget
    chart: ./charts/actual-http-api
    version: 0.1.0
    values:
      - ./applications/actual-budget/api.values.yaml
    needs:
      - longhorn-system/longhorn
      - actual-budget/actual-budget

  - name: home-assistant
    namespace: home-assistant
    chart: home-assistant/home-assistant
    version: 0.3.87
    values:
      - ./applications/home-assistant/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: mosquitto
    namespace: home-assistant
    chart: t3n/mosquitto
    version: 2.4.1
    values:
      - ./applications/mosquitto/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: zigbee2mqtt
    namespace: home-assistant
    chart: zigbee2mqtt/zigbee2mqtt
    version: 2.14.2
    values:
      - ./applications/z2m/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: mqtt-exporter
    namespace: home-assistant
    chart: ./charts/mqtt-exporter
    version: 0.1.1
    values:
      - ./applications/mqtt-exporter/values.yaml

  - name: garage
    namespace: garage
    createNamespace: true
    chart: garage/garage
    version: 0.9.3
    values:
      - ./applications/garage/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: evolution-api
    namespace: evolution-api
    chart: ./charts/evolution-api
    version: 0.1.0
    values:
      - ./applications/evolution-api/values.yaml
    needs:
      - cnpg-system/cloudnative-pg
      - longhorn-system/longhorn

  - name: cloudflared
    createNamespace: true
    namespace: cloudflared
    chart: wrsys/cloudflare-tunnel-remote
    version: 0.13.0
    values:
      - ./applications/cloudflared/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: uptime-kuma
    namespace: uptime-kuma
    createNamespace: true
    chart: dirsigler/uptime-kuma
    version: 4.2.0
    values:
      - ./applications/uptime-kuma/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: memos
    namespace: memos
    createNamespace: true
    chart: ./charts/memos
    version: 0.1.0
    values:
      - ./applications/memos/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: memo-mcp
    namespace: memos
    chart: memo-mcp/memo-mcp
    version: 0.5.0
    values:
      - ./applications/memo-mcp/values.yaml
    needs:
      - memos/memos

  - name: apprise
    namespace: apprise
    createNamespace: true
    chart: ./charts/apprise
    version: 0.1.0
    values:
      - ./applications/apprise/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: mixuruca
    namespace: mixuruca
    createNamespace: true
    chart: ./charts/mixuruca
    version: 0.1.0
    values:
      - ./applications/mixuruca/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: registry
    namespace: registry
    createNamespace: true
    chart: ./charts/registry
    version: 0.1.0
    values:
      - ./applications/registry/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: booker
    namespace: booker
    createNamespace: true
    chart: ./charts/booker
    version: 0.1.0
    values:
      - ./applications/booker/values.yaml

  - name: restic
    namespace: restic
    createNamespace: true
    chart: ./charts/restic
    version: 0.1.0
    values:
      - ./applications/restic/values.yaml

  - name: paperless
    namespace: paperless
    createNamespace: true
    chart: ./charts/paperless
    version: 0.1.0
    values:
      - ./applications/paperless/values.yaml
    needs:
      - cnpg-system/cloudnative-pg
      - redis-operator-system/redis-operator
      - longhorn-system/longhorn

  - name: pocket-id
    namespace: pocket-id
    createNamespace: true
    chart: ./charts/pocket-id
    version: 0.1.0
    values:
      - ./applications/pocket-id/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: tinyauth
    namespace: tinyauth
    createNamespace: true
    chart: tinyauth/tinyauth
    version: 2.2.0
    values:
      - ./applications/tinyauth/values.yaml
    needs:
      - longhorn-system/longhorn

  - name: pombo
    namespace: pombo
    createNamespace: true
    chart: ./charts/pombo
    version: 0.1.0
    values:
      - ./applications/pombo/values.yaml
    needs:
      - longhorn-system/longhorn
      - paperless/paperless

  - name: coruja
    namespace: coruja
    createNamespace: true
    chart: ./charts/coruja
    version: 0.1.0
    values:
      - ./applications/coruja/values.yaml
    needs:
      - paperless/paperless
      - pombo/pombo

  - name: beszel
    namespace: beszel
    createNamespace: true
    chart: ./charts/beszel
    version: 0.1.0
    values:
      - ./applications/beszel/values.yaml
    needs:
      - longhorn-system/longhorn
