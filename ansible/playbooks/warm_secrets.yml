---
# Ansible lookups aren't cached: every task that references a var built from
# lookup('community.general.onepassword', ...) re-runs that lookup, re-prompting
# 1Password's biometric unlock each time. With ~29 such vars in
# group_vars/all/all.yaml referenced across many tasks on multiple hosts, a
# single playbook run can trigger dozens of prompts.
#
# This resolves them all once per host up front and stores them as facts
# (which take precedence over group_vars and are plain values, not lookups),
# so every later reference in the same `ansible-playbook` invocation reads the
# cached value instead of hitting 1Password again. Run this before any other
# playbook in the same invocation, e.g.:
#   ansible-playbook playbooks/warm_secrets.yml playbooks/init.yml
- name: Resolve 1Password secrets once per host
  hosts: all
  gather_facts: false
  tasks:
    - name: Cache secrets as facts on every host
      run_once: true
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ ansible_play_hosts_all }}"
      ansible.builtin.set_fact:
        password_salt: "{{ password_salt }}"
        maintenance_user: "{{ maintenance_user }}"
        maintenance_password: "{{ maintenance_password }}"
        maintenance_ssh_public_key: "{{ maintenance_ssh_public_key }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        agendaodonto_staging_user: "{{ agendaodonto_staging_user }}"
        agendaodonto_staging_password: "{{ agendaodonto_staging_password }}"
        agendaodonto_production_user: "{{ agendaodonto_production_user }}"
        agendaodonto_production_password: "{{ agendaodonto_production_password }}"
        wg_nas_public_key: "{{ wg_nas_public_key }}"
        wg_nas_private_key: "{{ wg_nas_private_key }}"
        wg_mac_public_key: "{{ wg_mac_public_key }}"
        wg_mac_private_key: "{{ wg_mac_private_key }}"
        wg_s22_public_key: "{{ wg_s22_public_key }}"
        wg_s22_private_key: "{{ wg_s22_private_key }}"
        wg_github_actions_public_key: "{{ wg_github_actions_public_key }}"
        wg_github_actions_private_key: "{{ wg_github_actions_private_key }}"
        wg_ipad_public_key: "{{ wg_ipad_public_key }}"
        wg_ipad_private_key: "{{ wg_ipad_private_key }}"
        wg_raspberry_pi_office_public_key: "{{ wg_raspberry_pi_office_public_key }}"
        wg_raspberry_pi_office_private_key: "{{ wg_raspberry_pi_office_private_key }}"
        wg_opi_1_public_key: "{{ wg_opi_1_public_key }}"
        wg_opi_1_private_key: "{{ wg_opi_1_private_key }}"
        wg_k3s_node_01_public_key: "{{ wg_k3s_node_01_public_key }}"
        wg_agendaodonto_public_key: "{{ wg_agendaodonto_public_key }}"
        wg_gateway_public_key: "{{ wg_gateway_public_key }}"
        wg_server_public_key: "{{ wg_server_public_key }}"
        wg_server_private_key: "{{ wg_server_private_key }}"
        wg_server_endpoint: "{{ wg_server_endpoint }}"
        k3s_token: "{{ k3s_token }}"
        cloudflare_email: "{{ cloudflare_email }}"
        cloudflare_api_key: "{{ cloudflare_api_key }}"
