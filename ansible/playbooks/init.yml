---
- name: Shared Initialization
  hosts: all
  become: true
  roles:
    - shared_init
    - geerlingguy.security
    - name: moreati.term.terminfo
      become: true

- name: NAS Initialization
  hosts: nas
  become: true
  roles:
    - nas_init

- name: K3s Node Initialization
  hosts: k3s_cluster
  become: true
  roles:
    - k3s_init
